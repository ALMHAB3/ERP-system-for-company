# On-premises deployment: one server in the office, reachable from the LAN only.
# Start:  docker compose up -d --build     Logs: docker compose logs -f app
x-app: &app
  build: .
  env_file: .env
  environment: { DB_HOST: db, REDIS_HOST: redis }
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  app:
    <<: *app
    volumes: [storage:/var/www/html/storage]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      retries: 5

  # Runs migrations once at start-up, then exits.
  migrate:
    <<: *app
    command: php artisan migrate --force
    restart: "no"
    volumes: [storage:/var/www/html/storage]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment: { ERP_HOST: "${ERP_HOST:-erp.local}" }
    ports: ["443:443", "80:80"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/var/www/html/public:ro
      - caddy_data:/data
    depends_on: [app]

  worker:
    <<: *app
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes: [storage:/var/www/html/storage]

  scheduler:
    <<: *app
    command: php artisan schedule:work
    volumes: [storage:/var/www/html/storage]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-erp}
      POSTGRES_USER: ${DB_USERNAME:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-erp} -d ${DB_DATABASE:-erp}"]
      interval: 5s
      retries: 10
    # no published port: the database is reachable only from other containers

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

  # Nightly dump of the database into ./backups (keep copies on a SECOND disk or machine too).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USERNAME:-erp}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-erp}
      BACKUP_DIR: /backups
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ${BACKUP_PATH:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do now=$$(date +%H); if [ \"$$now\" = \"$$BACKUP_HOUR\" ]; then sh /backup.sh; sleep 3700; else sleep 600; fi; done"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
